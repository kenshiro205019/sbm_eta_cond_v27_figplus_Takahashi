name: Temporary Argos English to Japanese model download

on:
  pull_request:
    branches:
      - main

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    steps:
      - name: Download English to Japanese Argos model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p model
          curl -L --fail --retry 8 --retry-delay 5 \
            'https://argos-net.com/v1/translate-en_ja-1_1.argosmodel' \
            -o model/translate-en_ja-1.1.argosmodel
          test -s model/translate-en_ja-1.1.argosmodel
          sha256sum model/* > model/SHA256SUMS.txt
          ls -lh model
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: argos-en-to-ja-model
          path: model
          retention-days: 1
          if-no-files-found: error
