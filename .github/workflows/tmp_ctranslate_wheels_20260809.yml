name: Temporary NLLB CTranslate2 model download

on:
  pull_request:
    branches:
      - main

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    steps:
      - name: Download NLLB-200 distilled 600M INT8 CTranslate2 files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p nllb-model
          base='https://huggingface.co/osa911/nllb-200-distilled-600M-ct2-int8/resolve/main'
          for f in model.bin sentencepiece.bpe.model shared_vocabulary.json config.json; do
            echo "Downloading $f"
            curl -L --fail --retry 8 --retry-delay 5 "$base/$f?download=true" -o "nllb-model/$f"
            test -s "nllb-model/$f"
          done
          sha256sum nllb-model/* > nllb-model/SHA256SUMS.txt
          ls -lh nllb-model
      - name: Upload NLLB model artifact
        uses: actions/upload-artifact@v4
        with:
          name: nllb-200-distilled-600M-ct2-int8
          path: nllb-model
          retention-days: 1
          if-no-files-found: error
