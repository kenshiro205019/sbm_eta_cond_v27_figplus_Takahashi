name: Temporary Argos Asian language model download

on:
  pull_request:
    branches:
      - main

jobs:
  fetch-models:
    runs-on: ubuntu-latest
    steps:
      - name: Download Argos package index and required models
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p models
          curl -L --fail --retry 5 --retry-delay 3 \
            'https://raw.githubusercontent.com/argosopentech/argospm-index/main/index.json' \
            -o models/index.json
          python3 - <<'PY'
          import json, pathlib
          items=json.load(open('models/index.json',encoding='utf-8'))
          wanted=[]
          for src in ('ko','zh'):
              direct=[p for p in items if p.get('from_code')==src and p.get('to_code')=='ja']
              if direct:
                  wanted.append(sorted(direct,key=lambda p:p.get('package_version',''))[-1])
              else:
                  piv=[p for p in items if p.get('from_code')==src and p.get('to_code')=='en']
                  if not piv:
                      raise SystemExit(f'No direct or English-pivot package for {src}')
                  wanted.append(sorted(piv,key=lambda p:p.get('package_version',''))[-1])
          with open('models/selected.json','w',encoding='utf-8') as f:
              json.dump(wanted,f,ensure_ascii=False,indent=2)
          with open('models/selected.tsv','w',encoding='utf-8') as f:
              for p in wanted:
                  links=p.get('links') or []
                  if not links: raise SystemExit(f'No links for {p}')
                  name=f"translate-{p['from_code']}_{p['to_code']}-{p.get('package_version','unknown')}.argosmodel"
                  f.write(name+'\t'+links[0]+'\n')
          print(json.dumps(wanted,ensure_ascii=False,indent=2))
          PY
          while IFS=$'\t' read -r name url; do
            echo "Downloading $name from $url"
            curl -L --fail --retry 5 --retry-delay 3 "$url" -o "models/$name"
            test -s "models/$name"
          done < models/selected.tsv
          ls -lh models
      - name: Upload language models artifact
        uses: actions/upload-artifact@v4
        with:
          name: argos-ko-zh-to-ja-models
          path: models
          retention-days: 1
          if-no-files-found: error
